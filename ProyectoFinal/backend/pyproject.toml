[project]
name = "chaucherapp-backend"
version = "1.0.0"
description = "API de priorización de tickets de ChaucherApp"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "scikit-learn>=1.5",
